<!doctype html>
<html lang="es">
    <head>

        <title>Edición de imágenes</title>
    </head>
    <body>
        <header>
            <h1>Edición de imágenes</h1>
        </header>
        <nav></nav>
        <main>
            <article>
                <h2>Oso polar</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Veritatis harum porro facere doloribus enim molestias hic eius quisquam deleniti recusandae, a numquam perspiciatis necessitatibus eum optio repellendus ducimus, dolorem tempore!</p>
